name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Export APK
        env:
          HOME: /root
        run: |
          mkdir -v -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android Debug" build/tetris3d.apk 2>&1 | tee export.log
          test -f build/tetris3d.apk || { grep -iE "error|fail|not found|invalid" export.log | head -20; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tetris3d-apk
          path: build
          if-no-files-found: error

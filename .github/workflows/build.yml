name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Export APK
        env:
          HOME: /root
        run: |
          mkdir -v -p build
          echo "== settings =="
          find /root/.config/godot -name 'editor_settings*' -exec grep -iE "android|java|keystore" {} \;
          echo "== files =="
          ls -la /root/debug.keystore /usr/lib/android-sdk 2>&1 | head -20
          ls /root/.local/share/godot/export_templates/*/ 2>&1 | head -30
          java -version 2>&1
          printf 'keystore/debug="/root/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' >> export_presets.cfg
          timeout 180 godot --headless --import 2>&1 | tail -5 || true
          timeout 600 godot --headless --verbose --export-debug "Android Debug" build/tetris3d.apk 2>&1 | tee export.log || true
          echo "== error detail =="
          grep -A6 "configuration errors" export.log | cat -A | head -30
          test -f build/tetris3d.apk || { echo "=== APK TIDAK TERBUAT ==="; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tetris3d-apk
          path: build
          if-no-files-found: error

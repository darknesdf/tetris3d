name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Export APK
        env:
          HOME: /root
        run: |
          mkdir -v -p build
          JH=${JAVA_HOME:-$(ls -d /usr/lib/jvm/*openjdk*amd64 2>/dev/null | head -1)}
          export JAVA_HOME=$JH
          F=$(find /root/.config/godot -name 'editor_settings*.tres' | head -1)
          echo "export/android/java_sdk_path = \"$JH\"" >> "$F"
          {
            echo "JAVA_HOME=$JH"
            ls /usr/lib/jvm
            ls /usr/lib/android-sdk/build-tools
            ls /usr/lib/android-sdk/platforms
            grep -iE "android|java" "$F"
          } > diag.txt 2>&1
          printf 'keystore/debug="/root/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' >> export_presets.cfg
          timeout 180 godot --headless --import > /dev/null 2>&1 || true
          timeout 600 godot --headless --verbose --export-debug "Android Debug" build/tetris3d.apk > export.log 2>&1 || true
          test -f build/tetris3d.apk && exit 0
          echo "=== APK TIDAK TERBUAT ==="
          cat diag.txt
          grep -A4 -iE "error" export.log | grep -v "is not exposed" | tail -25
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tetris3d-apk
          path: build
          if-no-files-found: error

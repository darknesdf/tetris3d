name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Export APK
        env:
          HOME: /root
        run: |
          mkdir -v -p build
          timeout 180 godot --headless --verbose --editor --quit 2>&1 | tail -30 || true
          timeout 600 godot --headless --verbose --export-debug "Android Debug" build/tetris3d.apk 2>&1 | tee export.log || true
          test -f build/tetris3d.apk || { echo "=== APK TIDAK TERBUAT ==="; tail -40 export.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tetris3d-apk
          path: build
          if-no-files-found: error
